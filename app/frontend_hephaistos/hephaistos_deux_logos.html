<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Héphaïstos</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#000;background:#fff}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid #0b3d91;outline-offset:2px}
[hidden]{display:none!important}
.view{height:100%;display:flex;flex-direction:column}

/* Logos NASA × partenaire : modifier les chemins dans CONFIG plus bas */
.logo-pair{display:flex;align-items:center;justify-content:center;gap:18px}
.logo-pair.big{margin-bottom:44px}
.logo-pair.small{gap:9px}
.logo-pair .logo-slot{display:flex;align-items:center;justify-content:center}
.logo-pair.big .logo-slot{width:170px;height:130px}
.logo-pair.small .logo-slot{width:56px;height:46px}
.logo-slot img,.logo-slot svg{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.logo-cross{font-family:Arial,sans-serif;font-weight:700;font-size:32px}
.logo-pair.small .logo-cross{font-size:18px}
.logo-placeholder{font-size:13px;color:#555;border:1px dashed #aaa;padding:10px;text-align:center}
.logo-pair.small .logo-placeholder{font-size:9px;padding:4px}

/* Menu principal */
#menu{align-items:center;justify-content:flex-start;padding-top:9vh;text-align:center}
#menu h1{font-size:22px;font-weight:700;margin-bottom:28px}
#menu h1 span{font-weight:400}

.opts{display:flex;flex-direction:column;gap:12px;width:260px}
.opt{padding:14px;background:#fff;border:1px solid #000;font-weight:700;cursor:pointer}
.opt:hover{background:#000;color:#fff}

/* Barre du haut (Prédiction et Chat) */
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid #000}
.back{background:none;border:0;cursor:pointer;font-weight:700;padding:6px 4px}
.back:hover{text-decoration:underline}

/* Prédiction : deux moitiés */
.split{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}
.left{border-right:1px solid #000;padding:24px 28px;overflow:auto}
.right{display:grid;grid-template-rows:1fr 1fr;min-height:0}
.pred{background:#000;color:#fff;padding:24px 28px;overflow:auto}
.src{border-top:1px solid #000;padding:20px 28px;overflow:auto}
h2{font-size:16px;font-weight:700;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;margin-bottom:4px}
.field input,.field select{width:100%;padding:9px;border:1px solid #000;background:#fff}
.go{margin-top:6px;width:100%;padding:12px;background:#000;color:#fff;border:1px solid #000;font-weight:700;cursor:pointer}
.go:hover{background:#fff;color:#000}
.go:disabled{opacity:.5;cursor:wait}
.big-num{font-size:64px;font-weight:700;line-height:1.1}
.pred p{margin-top:8px;font-size:13px;color:#ddd}
.tag{display:inline-block;margin-bottom:10px;padding:2px 8px;border:1px solid #fff;font-size:11px}
.src ul{list-style:none;padding:0}
.src li{padding:9px 0;border-bottom:1px solid #ddd;font-size:13px;line-height:1.45}
.src li:last-child{border-bottom:0}
.src a{color:#0b3d91}
.muted{color:#555}
.pred .muted{color:#aaa}

/* Chat */
.chat{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:820px;margin:0 auto}
#log{flex:1;overflow:auto;padding:22px 22px 8px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:78%;padding:11px 14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:#000;color:#fff}
.msg.a{align-self:flex-start;background:#f1f1f1}
.msg .s{margin-top:10px;padding-top:8px;border-top:1px solid #ccc;font-size:12px;white-space:normal}
.msg .s a{color:#0b3d91}
.msg.err{background:#fff;border:1px solid #000}
.empty{margin:auto;text-align:center;color:#555}
.bar{display:flex;gap:10px;padding:14px 22px 22px}
.bar textarea{flex:1;resize:none;height:52px;padding:12px;border:1px solid #000}
.bar button{padding:0 22px;background:#000;color:#fff;border:1px solid #000;font-weight:700;cursor:pointer}
.bar button:disabled{opacity:.5;cursor:wait}

@media(max-width:800px){
  .split{grid-template-columns:1fr;overflow:auto}
  .left{border-right:0;border-bottom:1px solid #000}
  .right{grid-template-rows:auto auto}
}
</style>
</head>
<body>

<!-- ============ MENU PRINCIPAL ============ -->
<section class="view" id="menu">
  <h1>Héphaïstos <span>: menu principal</span></h1>
  <div class="logo-pair big"><div class="logo-slot" data-logo="nasa"></div><span class="logo-cross" aria-label="fois">×</span><div class="logo-slot" data-logo="partner"></div></div>
  <div class="opts">
    <button class="opt" data-go="predict">Prédiction</button>
    <button class="opt" data-go="chat">Chat</button>
  </div>
</section>

<!-- ============ PRÉDICTION ============ -->
<section class="view" id="predict" hidden>
  <div class="top">
    <button class="back" data-go="menu">&lt; Retour</button>
    <div class="logo-pair small"><div class="logo-slot" data-logo="nasa"></div><span class="logo-cross" aria-label="fois">×</span><div class="logo-slot" data-logo="partner"></div></div>
  </div>
  <div class="split">
    <!-- Moitié gauche : variables d'entrée -->
    <div class="left">
      <h2>Conditions de l’essai</h2>
      <!--
        VARIABLES D'EXEMPLE : à remplacer par la liste définitive.
        Elles suivent le schéma src/common/schema.py (fuel_type, material, o2_percent,
        pressure_kpa, flow_cm_s, gravity). Pour en ajouter une : copier un bloc .field,
        garder l'attribut name= : sa valeur est envoyée telle quelle à l'IA Python.
      -->
      <form id="form" autocomplete="off">
        <div class="field"><label for="fuel_type">Type de combustible</label>
          <select id="fuel_type" name="fuel_type"><option value="solid">Solide</option><option value="droplet">Gouttelette</option><option value="gas">Gaz</option></select></div>
        <div class="field"><label for="material">Matériau</label>
          <input id="material" name="material" type="text" value="PMMA" required></div>
        <div class="field"><label for="o2_percent">Oxygène (%)</label>
          <input id="o2_percent" name="o2_percent" type="number" step="0.1" min="0" max="100" value="21" required></div>
        <div class="field"><label for="pressure_kpa">Pression (kPa)</label>
          <input id="pressure_kpa" name="pressure_kpa" type="number" step="0.1" min="0" value="101.3" required></div>
        <div class="field"><label for="flow_cm_s">Débit d’air (cm/s)</label>
          <input id="flow_cm_s" name="flow_cm_s" type="number" step="0.1" min="0" value="10" required></div>
        <div class="field"><label for="gravity">Gravité</label>
          <select id="gravity" name="gravity"><option value="micro">Microgravité</option><option value="1g">1 g (comparaison)</option></select></div>
        <button class="go" id="goPredict" type="submit">Lancer la prédiction</button>
      </form>
    </div>

    <!-- Moitié droite : prédiction (noir) puis sources -->
    <div class="right">
      <div class="pred" id="predOut" aria-live="polite">
        <h2>Prédiction</h2>
        <p class="muted">Renseignez les conditions puis lancez la prédiction.</p>
      </div>
      <div class="src" id="srcOut">
        <h2>Sources</h2>
        <p class="muted">Les essais NASA jugés proches apparaîtront ici.</p>
      </div>
    </div>
  </div>
</section>

<!-- ============ CHAT ============ -->
<section class="view" id="chat" hidden>
  <div class="top">
    <button class="back" data-go="menu">&lt; Retour</button>
    <div class="logo-pair small"><div class="logo-slot" data-logo="nasa"></div><span class="logo-cross" aria-label="fois">×</span><div class="logo-slot" data-logo="partner"></div></div>
  </div>
  <div class="chat">
    <div id="log" aria-live="polite">
      <div class="empty" id="chatEmpty">Posez une question sur les données de combustion de la NASA.</div>
    </div>
    <div class="bar">
      <textarea id="q" placeholder="Écrivez votre message…" aria-label="Message"></textarea>
      <button id="send">Envoyer</button>
    </div>
  </div>
</section>

<script>
"use strict";

/* =====================================================================
   CONFIGURATION : POINTS DE BRANCHEMENT DES IA PYTHON
   ===================================================================== */
const CONFIG = {
  // >>> ZONE À MODIFIER 1 : logo NASA.
  // Placer le fichier officiel du logo à cet emplacement (SVG ou PNG).
  // Tant qu'il est absent, un logo provisoire est affiché.
  LOGO_URL: "logo-nasa-sur-fond-blanc.PNG",

  // >>> ZONE À MODIFIER : logo du partenaire, affiché à droite du ×.
  // Exemple : "./assets/logo-partenaire.png" ou une URL https://...
  // Laisser vide pour afficher un emplacement provisoire.
  PARTNER_LOGO_URL: "logo_proteus_3.png",

  // >>> ZONE À MODIFIER 2 : IA de PRÉDICTION (Python).
  // URL de l'API qui appelle predict(conditions) (src/models/predict.py).
  PREDICT_URL: "http://localhost:8000/predict",

  // >>> ZONE À MODIFIER 3 : IA du CHAT (Python).
  // URL de l'API qui appelle ask(question) (src/rag/ask.py).
  CHAT_URL: "http://localhost:8000/ask",

  // true = réponses factices étiquetées DEMO (aucune URL appelée).
  // Passer à false dès que les API Python tournent.
  USE_DEMO: true,
};

const NO_SOURCE = "Aucun test de la NASA n’a été effectué sur une situation similaire";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Logo NASA ---------- */
function fallbackLogo(){
  const d = document.createElement("div");
  d.innerHTML = '<svg viewBox="0 0 100 100" role="img" aria-label="NASA (logo provisoire)"><circle cx="50" cy="50" r="48" fill="#0b3d91"/><text x="50" y="58" text-anchor="middle" font-family="Arial" font-weight="700" font-size="26" fill="#fff">NASA</text></svg>';
  return d.firstChild;
}
document.querySelectorAll(".logo-slot").forEach(slot => {
  const isNasa = slot.dataset.logo === "nasa";
  const url = isNasa ? CONFIG.LOGO_URL : CONFIG.PARTNER_LOGO_URL;
  const placeholder = () => {
    if (isNasa) slot.replaceChildren(fallbackLogo());
    else {
      const label = document.createElement("span");
      label.className = "logo-placeholder";
      label.textContent = "Votre logo";
      slot.replaceChildren(label);
    }
  };
  if (!url) { placeholder(); return; }
  const img = new Image();
  img.alt = isNasa ? "NASA" : "Logo partenaire";
  img.onerror = () => {
    console.error("Logo introuvable :", url);
    placeholder();
  };
  img.src = url;
  slot.appendChild(img);
});

/* ---------- Navigation (menu / prédiction / chat) ---------- */
function show(id){
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== id);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if(b) show(b.dataset.go);
});

/* ---------- Rendu d'une source ---------- */
// Format attendu : tout champ est optionnel, seuls ceux présents sont affichés.
// { experiment, psi_id, test_id, o2_percent, pressure_kpa, flow_cm_s, material,
//   source_doc, source_page, doi, title, ntrs_id, page, url, demo }
function renderSource(s){
  const parts = [];
  const head = [s.experiment, s.psi_id && "(" + s.psi_id + ")", s.test_id && "essai " + s.test_id, s.title, s.ntrs_id && "NTRS " + s.ntrs_id].filter(Boolean).join(" ");
  if(head) parts.push("<strong>" + esc(head) + "</strong>");
  const cond = [s.material, s.o2_percent != null && "O₂ " + s.o2_percent + " %", s.pressure_kpa != null && s.pressure_kpa + " kPa", s.flow_cm_s != null && s.flow_cm_s + " cm/s"].filter(Boolean).join(", ");
  if(cond) parts.push(esc(cond));
  const doc = [s.source_doc, (s.source_page || s.page) && "p. " + (s.source_page || s.page)].filter(Boolean).join(", ");
  if(doc) parts.push(esc(doc));
  const link = s.url || (s.doi && "https://doi.org/" + s.doi);
  if(link) parts.push('<a href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(s.doi || "lien") + "</a>");
  if(s.demo) parts.push('<span class="muted">DEMO : donnée factice</span>');
  return "<li>" + parts.join("<br>") + "</li>";
}

/* =====================================================================
   PRÉDICTION
   Contrat de l'API (JSON) :
   ENVOI    : { fuel_type, material, o2_percent, pressure_kpa, flow_cm_s, gravity }
   RÉPONSE  : { probability: 0.73,          // entre 0 et 1
                uncertainty: 0.08,          // optionnel, entre 0 et 1
                sources: [ {...}, ... ] }   // essais NASA proches ; [] si aucun
   ===================================================================== */
async function callPredict(conditions){
  if(CONFIG.USE_DEMO){
    // >>> ZONE DEMO : valeurs factices, à supprimer une fois l'IA branchée.
    await new Promise(r => setTimeout(r, 500));
    const o2 = conditions.o2_percent;
    const p = Math.min(0.97, Math.max(0.03, 0.2 + (o2 - 21) * 0.04));
    return { probability: p, uncertainty: 0.1, demo: true,
             sources: o2 > 40 ? [] : [{ experiment: "Exemple", psi_id: "DEMO", material: conditions.material, o2_percent: o2, demo: true }] };
  }
  // >>> ZONE PYTHON 1 : appel de predict(conditions) via PREDICT_URL.
  const r = await fetch(CONFIG.PREDICT_URL, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(conditions)
  });
  if(!r.ok) throw new Error("Le serveur a répondu " + r.status);
  return await r.json();
}

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const f = new FormData(e.target), c = {};
  for(const [k, v] of f.entries()) c[k] = (e.target[k].type === "number") ? Number(v) : v;
  const btn = $("#goPredict"); btn.disabled = true; btn.textContent = "Calcul en cours…";
  try{
    const res = await callPredict(c);
    const pct = Math.round(res.probability * 100);
    $("#predOut").innerHTML = "<h2>Probabilité d’incendie</h2>" +
      (res.demo ? '<span class="tag">DEMO</span><br>' : "") +
      '<div class="big-num">' + pct + " %</div>" +
      (res.uncertainty != null ? "<p>Incertitude : ± " + Math.round(res.uncertainty * 100) + " points</p>" : "") +
      "<p>" + esc(c.material) + " · O₂ " + c.o2_percent + " % · " + c.pressure_kpa + " kPa · " + c.flow_cm_s + " cm/s · " + (c.gravity === "micro" ? "microgravité" : "1 g") + "</p>";
    const list = res.sources || [];
    $("#srcOut").innerHTML = "<h2>Sources</h2>" + (list.length ? "<ul>" + list.map(renderSource).join("") + "</ul>" : '<p>' + NO_SOURCE + "</p>");
  }catch(err){
    $("#predOut").innerHTML = "<h2>Erreur</h2><p>Impossible de joindre l’IA de prédiction (" + esc(err.message) + ").</p>";
    $("#srcOut").innerHTML = "<h2>Sources</h2>";
  }
  btn.disabled = false; btn.textContent = "Lancer la prédiction";
});

/* =====================================================================
   CHAT
   Contrat de l'API (JSON) :
   ENVOI    : { question: "...", history: [ {role:"user"|"assistant", content:"..."} ] }
   RÉPONSE  : { answer: "...",
                sources: [ {title, ntrs_id, page, url}, ... ] }   // [] si "je ne sais pas"
   ===================================================================== */
const history = [];

async function callChat(question){
  if(CONFIG.USE_DEMO){
    // >>> ZONE DEMO : réponse factice, à supprimer une fois l'IA branchée.
    await new Promise(r => setTimeout(r, 600));
    return { answer: "[DEMO] Réponse factice. Branchez l’IA du chat pour obtenir des réponses fondées sur les documents de la NASA.", sources: [] };
  }
  // >>> ZONE PYTHON 2 : appel de ask(question) via CHAT_URL.
  const r = await fetch(CONFIG.CHAT_URL, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, history })
  });
  if(!r.ok) throw new Error("Le serveur a répondu " + r.status);
  return await r.json();
}

function addMsg(cls, html){
  $("#chatEmpty")?.remove();
  const d = document.createElement("div");
  d.className = "msg " + cls; d.innerHTML = html;
  $("#log").appendChild(d); $("#log").scrollTop = 1e9;
  return d;
}

async function sendChat(){
  const q = $("#q").value.trim();
  if(!q || $("#send").disabled) return;
  $("#q").value = ""; $("#send").disabled = true;
  addMsg("u", esc(q));
  const wait = addMsg("a", "…");
  try{
    const res = await callChat(q);
    history.push({ role: "user", content: q }, { role: "assistant", content: res.answer });
    const src = (res.sources || []).length ? '<div class="s"><strong>Sources</strong><ul style="list-style:none;padding:0">' + res.sources.map(renderSource).join("") + "</ul></div>" : "";
    wait.innerHTML = esc(res.answer) + src;
  }catch(err){
    wait.className = "msg err";
    wait.textContent = "Impossible de joindre l’IA du chat (" + err.message + ").";
  }
  $("#send").disabled = false; $("#q").focus();
}
$("#send").onclick = sendChat;
$("#q").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendChat(); } });
</script>
</body>
</html>
